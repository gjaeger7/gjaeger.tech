<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>St. George Poll</title>
    <style>
      :root {
        --ink: #20232b;
        --muted: #6d7280;
        --paper: #fffaf0;
        --panel: #ffffff;
        --line: #ded6c7;
        --gold: #bf8b3b;
        --gold-dark: #936323;
        --brick: #8f3f2c;
        --blue: #223c55;
        --blue-soft: #e6edf3;
        --shadow: 0 22px 60px rgba(32, 35, 43, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(191, 139, 59, 0.18), transparent 34rem),
          linear-gradient(135deg, #fffaf0 0%, #eef3f8 100%);
      }

      button,
      input {
        font: inherit;
      }

      .page {
        width: min(1080px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0 40px;
      }

      .masthead {
        display: grid;
        justify-items: center;
        gap: 12px;
        margin-bottom: 22px;
        text-align: center;
      }

      .logo {
        width: min(210px, 48vw);
        height: auto;
        display: block;
        filter: drop-shadow(0 14px 18px rgba(32, 35, 43, 0.13));
      }

      h1 {
        margin: 0;
        color: var(--blue);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2rem, 5vw, 4.2rem);
        font-weight: 700;
        letter-spacing: 0;
      }

      .tagline {
        margin: 0;
        color: var(--muted);
        font-size: clamp(0.96rem, 2.2vw, 1.12rem);
        line-height: 1.45;
      }

      .poll-shell {
        display: grid;
        gap: 18px;
      }

      .leader-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        min-height: 74px;
        padding: 18px 20px;
        border: 1px solid rgba(34, 60, 85, 0.14);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.78);
        box-shadow: 0 14px 34px rgba(32, 35, 43, 0.08);
        backdrop-filter: blur(6px);
      }

      .leader-label {
        margin: 0 0 4px;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .leader-name {
        margin: 0;
        color: var(--blue);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.35rem, 4vw, 2.2rem);
        line-height: 1;
      }

      .total-count {
        flex: 0 0 auto;
        min-width: 104px;
        padding: 10px 12px;
        border-radius: 8px;
        color: #ffffff;
        background: var(--blue);
        text-align: center;
      }

      .total-count strong {
        display: block;
        font-size: 1.7rem;
        line-height: 1;
      }

      .total-count span {
        display: block;
        margin-top: 4px;
        font-size: 0.74rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .options-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .option-card {
        position: relative;
        display: grid;
        gap: 16px;
        min-height: 260px;
        padding: 24px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .option-card::before {
        content: "";
        position: absolute;
        inset: 0;
        border-top: 7px solid transparent;
        pointer-events: none;
      }

      .option-card[data-choice="Speed Queen"]::before {
        border-color: var(--brick);
      }

      .option-card[data-choice="Maytag"]::before {
        border-color: var(--blue);
      }

      .option-card.is-winning {
        border-color: rgba(191, 139, 59, 0.82);
        box-shadow: 0 28px 70px rgba(191, 139, 59, 0.25);
      }

      .option-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .option-name {
        margin: 0;
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.85rem, 4.5vw, 3rem);
        line-height: 1;
      }

      .badge {
        min-width: 82px;
        padding: 7px 10px;
        border-radius: 999px;
        color: var(--blue);
        background: var(--blue-soft);
        font-size: 0.72rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-align: center;
        text-transform: uppercase;
      }

      .option-card.is-winning .badge {
        color: #ffffff;
        background: var(--gold-dark);
      }

      .vote-number {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.5;
      }

      .vote-number strong {
        display: block;
        color: var(--ink);
        font-size: clamp(2.35rem, 8vw, 4.2rem);
        line-height: 1;
      }

      .meter {
        width: 100%;
        height: 13px;
        overflow: hidden;
        border-radius: 999px;
        background: #ece6dc;
      }

      .meter-fill {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--gold), var(--brick));
        transition: width 260ms ease;
      }

      .option-card[data-choice="Maytag"] .meter-fill {
        background: linear-gradient(90deg, #537798, var(--blue));
      }

      .vote-button {
        align-self: end;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 54px;
        width: 100%;
        border: 0;
        border-radius: 8px;
        color: #ffffff;
        background: var(--ink);
        font-weight: 850;
        cursor: pointer;
        transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
      }

      .vote-button:hover {
        transform: translateY(-1px);
        box-shadow: 0 14px 28px rgba(32, 35, 43, 0.18);
      }

      .vote-button:disabled {
        cursor: not-allowed;
        opacity: 0.58;
        transform: none;
        box-shadow: none;
      }

      .vote-button:focus-visible,
      .modal-card button:focus-visible,
      input:focus-visible {
        outline: 3px solid rgba(191, 139, 59, 0.45);
        outline-offset: 3px;
      }

      .option-card[data-choice="Speed Queen"] .vote-button {
        background: var(--brick);
      }

      .option-card[data-choice="Maytag"] .vote-button {
        background: var(--blue);
      }

      .votes-panel {
        padding: 22px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.84);
        box-shadow: 0 14px 34px rgba(32, 35, 43, 0.08);
      }

      .votes-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 12px;
      }

      .votes-head h2 {
        margin: 0;
        color: var(--blue);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.4rem, 3vw, 2rem);
        letter-spacing: 0;
      }

      .status {
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .vote-list {
        display: grid;
        gap: 8px;
        min-height: 52px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .vote-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        min-height: 48px;
        padding: 10px 12px;
        border: 1px solid #ece5da;
        border-radius: 8px;
        background: #ffffff;
      }

      .voter-name {
        overflow: hidden;
        font-weight: 800;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .choice-pill {
        padding: 6px 10px;
        border-radius: 999px;
        color: #ffffff;
        background: var(--blue);
        font-size: 0.82rem;
        font-weight: 850;
      }

      .choice-pill.speed {
        background: var(--brick);
      }

      .empty {
        display: grid;
        align-items: center;
        min-height: 52px;
        margin: 0;
        color: var(--muted);
      }

      .modal {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 18px;
        background: rgba(18, 24, 31, 0.58);
      }

      .modal.is-open {
        display: flex;
      }

      .modal-card {
        width: min(460px, 100%);
        padding: 24px;
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.28);
      }

      .modal-title {
        margin: 0 0 6px;
        color: var(--blue);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.85rem;
      }

      .modal-copy {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.5;
      }

      .field-grid {
        display: grid;
        gap: 12px;
      }

      label {
        display: grid;
        gap: 6px;
        color: var(--ink);
        font-size: 0.88rem;
        font-weight: 850;
      }

      input {
        width: 100%;
        min-height: 48px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
        background: #fffdf8;
      }

      .error {
        min-height: 22px;
        margin: 8px 0 0;
        color: #a42d1f;
        font-size: 0.88rem;
        font-weight: 750;
      }

      .modal-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 18px;
      }

      .modal-actions button {
        min-height: 48px;
        border-radius: 8px;
        font-weight: 850;
        cursor: pointer;
      }

      .secondary {
        border: 1px solid var(--line);
        color: var(--ink);
        background: #ffffff;
      }

      .primary {
        border: 0;
        color: #ffffff;
        background: var(--blue);
      }

      @media (max-width: 760px) {
        .page {
          width: min(100% - 24px, 1080px);
          padding-top: 18px;
        }

        .leader-bar,
        .votes-head {
          align-items: stretch;
          flex-direction: column;
        }

        .options-grid {
          grid-template-columns: 1fr;
        }

        .option-card {
          min-height: 238px;
          padding: 22px;
        }
      }

      @media (max-width: 420px) {
        .option-head,
        .vote-row {
          grid-template-columns: 1fr;
        }

        .option-head {
          display: grid;
        }

        .badge,
        .choice-pill {
          justify-self: start;
        }

        .modal-actions {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

      <section class="poll-shell" aria-label="Poll">
        <div class="leader-bar" aria-live="polite">
          <div>
            <p class="leader-label">Current Leader</p>
            <p class="leader-name" id="leaderName">No votes yet</p>
          </div>

          <article class="option-card" data-choice="Speed Queen">
            <div class="option-head">
              <h2 class="option-name">Speed Queen</h2>
              <span class="badge" data-badge>Waiting</span>

            <p class="vote-number"><strong data-count>0</strong><span data-percent>0%</span> of votes</p>

            </div>

      <form class="modal-card" id="voteForm">
        <h2 class="modal-title" id="modalTitle">Vote for <span id="selectedChoice">Speed Queen</span></h2>
        <p class="modal-copy">Enter your first and last name.</p>
        <div class="field-grid">

            <input id="firstName" name="firstName" autocomplete="given-name" required>

    <script>
      const choices = ["Speed Queen", "Maytag"];
      const maxVotes = 8;
      const state = {
        votes: [],
        selectedChoice: null,
        apiMode: false
      };

      const leaderName = document.querySelector("#leaderName");
      const totalVotes = document.querySelector("#totalVotes");
      const totalLabel = document.querySelector("#totalLabel");
      const optionCards = [...document.querySelectorAll(".option-card")];
      const voteList = document.querySelector("#voteList");
      const saveStatus = document.querySelector("#saveStatus");
      const modal = document.querySelector("#voteModal");
      const voteForm = document.querySelector("#voteForm");
      const selectedChoice = document.querySelector("#selectedChoice");
      const firstName = document.querySelector("#firstName");
      const lastName = document.querySelector("#lastName");
      const formError = document.querySelector("#formError");
      const cancelVote = document.querySelector("#cancelVote");

      function cleanName(value) {
        return value.trim().replace(/\s+/g, " ");
      }

      function makeLocalVote(first, last, choice) {
        return {
          id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
          firstName: first,
          lastName: last,
          choice,
          createdAt: new Date().toISOString()
        };
      }

      function getCounts() {
        return choices.reduce((counts, choice) => {
          counts[choice] = state.votes.filter((vote) => vote.choice === choice).length;
          return counts;
        }, {});
      }

      function getLeader(counts) {
        const [speedCount, maytagCount] = choices.map((choice) => counts[choice]);
        if (speedCount === 0 && maytagCount === 0) return "No votes yet";
        if (speedCount === maytagCount) return "Tie";
        return speedCount > maytagCount ? "Speed Queen" : "Maytag";
      }

      function render() {
        const counts = getCounts();
        const total = state.votes.length;
        const leader = getLeader(counts);

        leaderName.textContent = leader;
        totalVotes.textContent = total;
        totalLabel.textContent = `of ${maxVotes} votes`;
        const pollFull = total >= maxVotes;

        optionCards.forEach((card) => {
          const choice = card.dataset.choice;
          const count = counts[choice];
          const percent = total ? Math.round((count / total) * 100) : 0;
          const isWinning = total > 0 && leader === choice;

          card.classList.toggle("is-winning", isWinning);
          card.querySelector("[data-count]").textContent = count;
          card.querySelector("[data-percent]").textContent = `${percent}%`;
          card.querySelector("[data-fill]").style.width = `${percent}%`;
          card.querySelector("[data-badge]").textContent = isWinning ? "Winning" : leader === "Tie" && total ? "Tied" : "Waiting";
          const voteButton = card.querySelector("[data-vote]");
          voteButton.disabled = pollFull;
          voteButton.textContent = pollFull ? "Voting Complete" : `Vote ${choice}`;
        });

        voteList.innerHTML = "";
        if (!state.votes.length) {
          const empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "No votes recorded yet.";
          voteList.append(empty);
          return;
        }

        [...state.votes]
          .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
          .forEach((vote) => {
            const row = document.createElement("li");
            row.className = "vote-row";

            const name = document.createElement("span");
            name.className = "voter-name";
            name.textContent = `${vote.firstName} ${vote.lastName}`;

            const choice = document.createElement("span");
            choice.className = `choice-pill ${vote.choice === "Speed Queen" ? "speed" : "maytag"}`;
            choice.textContent = vote.choice;

            row.append(name, choice);
            voteList.append(row);
          });
      }

      async function fetchVotes() {
        const response = await fetch("/api/votes", { cache: "no-store" });
        if (!response.ok) throw new Error("Vote API unavailable");
        const payload = await response.json();
        if (!Array.isArray(payload.votes)) throw new Error("Unexpected vote response");
        state.apiMode = true;
        state.votes = payload.votes;
        localStorage.removeItem("st-george-equipment-poll-votes");
        saveStatus.textContent = "Shared votes";
      }

      async function recordVote(vote) {
        if (state.apiMode) {
          const response = await fetch("/api/votes", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(vote)
          });
          if (!response.ok) {
            const errorPayload = await response.json().catch(() => ({}));
            throw new Error(errorPayload.error || "Vote was not saved");
          }
          const payload = await response.json();
          state.votes = payload.votes;
          saveStatus.textContent = "Vote recorded";
          return;
        }

        throw new Error("Shared voting is temporarily unavailable. Please refresh and try again.");
      }

      function openModal(choice) {
        state.selectedChoice = choice;
        selectedChoice.textContent = choice;
        formError.textContent = "";
        voteForm.reset();
        modal.classList.add("is-open");
        setTimeout(() => firstName.focus(), 0);
      }

      function closeModal() {
        modal.classList.remove("is-open");
        state.selectedChoice = null;
      }

      document.querySelectorAll("[data-vote]").forEach((button) => {
        button.addEventListener("click", () => openModal(button.dataset.vote));
      });

      cancelVote.addEventListener("click", closeModal);

      modal.addEventListener("click", (event) => {
        if (event.target === modal) closeModal();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && modal.classList.contains("is-open")) closeModal();
      });

      voteForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const first = cleanName(firstName.value);
        const last = cleanName(lastName.value);

        if (!first || !last) {
          formError.textContent = "First and last name are required.";
          return;
        }

        if (!choices.includes(state.selectedChoice)) {
          formError.textContent = "Please choose Speed Queen or Maytag.";
          return;
        }

        if (state.votes.length >= maxVotes) {
          formError.textContent = "All 8 votes have already been recorded.";
          return;
        }

        const vote = makeLocalVote(first, last, state.selectedChoice);

        try {
          await recordVote(vote);
          closeModal();
          render();
        } catch (error) {
          formError.textContent = error.message || "The vote could not be saved. Please try again.";
        }
      });

      (async function init() {
        try {
          await fetchVotes();
        } catch {
          state.apiMode = false;
          state.votes = [];
          saveStatus.textContent = "Shared voting unavailable";
        }
        render();
      })();
    </script>
  </body>
</html>
